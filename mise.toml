#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[deps.npm]
  auto = true

[env]
  NODE_ENV = { default = "development" }
  _.path   = ["{{config_root}}/node_modules/.bin"]

[settings]
  idiomatic_version_file_enable_tools  = ["node", "npm"]
  idiomatic_version_file_disable_files = ["node:package.json"]
  npm.package_manager                  = "npm"
  experimental                         = true

[task_config]
  includes = ["tasks.toml"]

[task_config.cache]
  enabled = true

[tools]
  node                  = "26.12.0"
  npm                   = "12.2.1"
  "npm:@types/node"     = "latest"
  "npm:knip"            = "latest"
  "npm:oxfmt"           = "latest"
  "npm:oxlint"          = "latest"
  "npm:oxlint-tsgolint" = "latest"
  "npm:tsx"             = "latest"
  "npm:typescript"      = "latest"
